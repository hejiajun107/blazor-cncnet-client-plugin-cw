; CW UI 插件自描述 —— 与插件 DLL 同级，部署到游戏根 Plugins/cw-ui/plugin.ini
;
; 客户端启动时读 Resources/ClientDefinitions.ini 的 [Plugins] 节得到启用列表，
; 再按本文件加载插件程序集。

[Plugin]
; 插件唯一标识（与目录名/ClientDefinitions.ini 键一致）
Id=cw-ui
; 展示名
Name=CW UI
; 编译时针对的插件契约版本，须等于宿主 PluginApi.CurrentVersion
ApiVersion=1
; 入口程序集文件名（可省略：省略时遍历本目录内 *.dll 探测 EntryType）
Assembly=CwUi.dll
; 入口类型全名（须实现 ICncNetPlugin）
EntryType=CwUi.CwUiPluginEntry
; 自带样式（相对本目录；空 = 不注入）
Style=plugin.css
; 自带脚本（相对本目录；空 = 不注入）
Script=cw-overlay.js

[Update]
; 启动时检查“大版本更新”（旧客户端 NeedDownloadNew 逻辑）：
; 命中时弹出手动下载地址，不进入在线更新。
CheckOnStartup=true
; 当前 mod 版本号（与服务器约定格式一致，例如 3.1800 / 3.5）。
; 每次发版请同步修改；留空则回退到游戏根 version 文件的 [DTA] Version。
Version=3.1800
; 检查接口（通常无需修改）
Endpoint=http://www.racw.top/updates/NeedDownloadNew
